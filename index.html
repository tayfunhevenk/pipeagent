  <style>
    /* Markenfarben der PipeAgent-Landingpage */
    :root {
      --ink: #0A0A0A;
      --muted: #3F3F46;
      --line: #E4E4E7;
      --soft: #FAFAFA;
      --accent: #E11D48;
      --accent-dark: #9F1239;
      --accent-tint: #FDE8EE;
      --logo-orange: #FF5C1F;
      --step-bg: rgba(249, 115, 22, .10);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--soft);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Weiche Farbflächen im Hintergrund */
    .glow { position: fixed; z-index: -1; border-radius: 50%; filter: blur(90px); opacity: .55; animation: float 14s ease-in-out infinite alternate; }
    .glow--accent { width: 460px; height: 460px; background: var(--accent-tint); top: -120px; right: -100px; }
    .glow--orange { width: 400px; height: 400px; background: #FFE3D6; bottom: -140px; left: -120px; animation-delay: -7s; }

    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 24px; }

    .card {
      width: 100%; max-width: 600px;
      background: #FFFFFF;
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 56px 48px;
      text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 28px;
      box-shadow: 0 24px 60px -30px rgba(10, 10, 10, .18);
      animation: fade-up .8s ease-out both;
    }

    .logo { height: 96px; width: auto; }

    .badge {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 8px 16px; border-radius: 999px;
      background: var(--accent-tint); color: var(--accent-dark);
      font-size: 13px; letter-spacing: .06em; text-transform: uppercase;
    }
    .badge__dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 2s ease-out infinite; }

    h1 {
      margin: 0;
      font-family: "Plus Jakarta Sans", "Inter", sans-serif;
      font-weight: 500; letter-spacing: -0.02em;
      font-size: clamp(30px, 5vw, 44px); line-height: 1.1;
    }

    .lead { margin: 0; max-width: 440px; font-size: 17px; line-height: 1.6; color: var(--muted); }

    /* Fortschrittsbalken */
    .progress { width: 100%; max-width: 320px; height: 6px; border-radius: 999px; background: #F4F4F5; overflow: hidden; }
    .progress__bar {
      width: 40%; height: 100%; border-radius: 999px;
      background: linear-gradient(90deg, var(--logo-orange), var(--accent));
      animation: load 2.4s ease-in-out infinite;
    }
    .progress-label { margin: -14px 0 0; font-size: 13px; color: #71717A; }

    footer { padding: 24px; text-align: center; font-size: 13px; color: #71717A; }

    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(225, 29, 72, .45); } 70% { box-shadow: 0 0 0 10px rgba(225, 29, 72, 0); } 100% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0); } }
    @keyframes load { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    @keyframes float { to { transform: translate(40px, 30px) scale(1.08); } }
    @keyframes fade-up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

    @media (max-width: 560px) {
      .card { padding: 40px 24px; gap: 24px; border-radius: 22px; }
      .logo { height: 76px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
</head>
